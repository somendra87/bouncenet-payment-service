server:
  servlet:
    context-path: '/api/payment-service'
  port: 9700

spring:
  application:
    name: bouncenet-payment-service
  config:
    import: optional:configserver:http://localhost:9701
  datasource:
    url: jdbc:postgresql://localhost:5432/payments_db
    username: payusr
    password: payusr
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

razorpay:
  razor-pay-id: rzp_test_SYyYQe3FWpovsd
  razor-pay-secret: 8YU37fUnot5WDScMRIVQBOzH
  #webhook-secret: <your-webhook-secret>

eureka:
  client:
    service-url:
      defaultZone: http://127.0.0.1:8761/eureka
    register-with-eureka: true
    fetch-registry: true
    enabled: false
  instance:
    prefer-ip-address: true

logging:
  level:
    com.bouncenet.payments: DEBUG

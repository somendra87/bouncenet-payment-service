spring:
  application:
    name: bouncenet-payment-service
  config:
    import: optional:configserver:http://localhost:9701
  datasource:
    url: jdbc:postgresql://localhost:5432/payments_db
    driver-class-name: org.postgresql.Driver
    username: payusr
    password: payusr
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgresSQLDialect
        format_sql: true